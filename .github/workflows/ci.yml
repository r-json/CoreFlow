name: CoreFlow CI Pipeline

on:
  push:
    branches: [ main, master, 'instawards/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  contract-tests:
    name: Soroban Contract Tests (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # No toolchain input: contracts/core-flow/rust-toolchain.toml pins 1.85.0
      # and declares the wasm32v1-none target. That pin is load-bearing --
      # soroban-sdk 20.5.0 fails to compile on newer rustc (ethnum E0512) and
      # fails to resolve on older cargo (zeroize edition2024).
      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85.0'
          targets: wasm32v1-none

      - name: Cache Cargo Registry & Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/core-flow/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/core-flow/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # wasm32v1-none, NOT wasm32-unknown-unknown: rustc 1.85 emits
      # reference-types into the latter and the Soroban host rejects the upload
      # with Error(WasmVm, InvalidAction). Building here keeps that regression
      # out of main rather than surfacing it at deploy time.
      #
      # Built BEFORE the tests: src/test.rs embeds this artifact with
      # include_bytes! for the upgrade tests, so the test crate cannot compile
      # until it exists.
      - name: Build Deployable WASM
        working-directory: contracts/core-flow
        run: cargo build --release --target wasm32v1-none

      - name: Run Rust Contract Test Suite
        working-directory: contracts/core-flow
        run: cargo test --locked

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-flow-wasm
          path: contracts/core-flow/target/wasm32v1-none/release/core_flow.wasm
          if-no-files-found: error

  test-and-build:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Run Automated Vitest Test Suite
        run: npm run test:ci

      # /bulk-pay constructs the contract client at prerender and refuses to
      # guess a contract address, so the build needs one. This is the public
      # v2 Testnet contract id (docs/DEPLOYMENTS.md), not a secret.
      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: 'testnet'
          NEXT_PUBLIC_COMPANY_NAME: 'CoreFlow'
          NEXT_PUBLIC_STELLAR_CONTRACT_ID: 'CDN4FIKLJ72WYNPBIKWYSDJWDZG22QNPLWI37VTUAE4EKKIBVAQRG5F4'

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The binary is pinned and checksum-verified rather than pulled through a
      # third-party action, so the scanner itself is a known artifact.
      - name: Install gitleaks 8.30.1
        run: |
          V=8.30.1
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" checksums.txt | sed "s/gitleaks_${V}_linux_x64.tar.gz/gitleaks.tar.gz/" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan full git history
        run: ./gitleaks git --config .gitleaks.toml --redact --log-opts="--all" --no-banner .
